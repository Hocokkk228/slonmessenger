name = "slon-api"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "slon-db"
database_id = "0e31fbcb-1135-4123-a354-8f39c03f2ef9"

# Хранилище медиа — Durable Objects на SQLite (бесплатный тариф, без карты)
[[durable_objects.bindings]]
name = "MEDIA"
class_name = "MediaStore"

# Хаб аккаунта: WebSocket всех устройств, журнал сообщений, очередь офлайн-сигналов
[[durable_objects.bindings]]
name = "HUB"
class_name = "UserHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MediaStore"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserHub"]
